version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: revenue_recovery_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: revenue_recovery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenue_recovery_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_secure_password@postgres:5432/revenue_recovery
      SQLITE_MUTEX_PATH: /app/data/idempotency_store.db
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - mutex_data:/app/data

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: revenue_recovery_dashboard
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://backend:8000

volumes:
  pgdata:
    driver: local
  mutex_data:
    driver: local
